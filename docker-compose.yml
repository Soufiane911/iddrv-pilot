services:
  # ─────────────────────────────────────────────────────
  # PostgreSQL + TimescaleDB (Stockage principal)
  # ─────────────────────────────────────────────────────
  timescaledb:
    image: timescale/timescaledb:2.28.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iddrv}
      POSTGRES_USER: ${POSTGRES_USER:-iddrv_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      TIMESCALEDB_TELEMETRY: "off"
    # Database remains local-only.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./db/seed_data.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iddrv_user} -d ${POSTGRES_DB:-iddrv}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────
  # Redis — Tampon de messages (Streaming OPC UA / Batch)
  # ─────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: iddrv_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:?DOCKER_DATABASE_URL must be set with URL-encoded credentials}
      REDIS_URL: redis://redis:6379/0
      APP_ENV: ${APP_ENV:-pilot}
      ALLOW_ANONYMOUS_READS: ${ALLOW_ANONYMOUS_READS:-false}
      # The API refuses to start in pilot mode unless this is explicitly set.
      SESSION_SECRET: ${SESSION_SECRET:-}
      # Set true whenever the web gateway is served through HTTPS.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      # Optional scraper secret for GET /metrics (X-Metrics-Token or Bearer).
      # Without it in pilot mode, only an admin session can read metrics.
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      METRICS_PUBLIC: ${METRICS_PUBLIC:-false}
    depends_on:
      timescaledb:
        condition: service_healthy
    command: ["sh", "-c", "python db/setup_db.py --db-url \"$$DATABASE_URL\" && uvicorn backend.app.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:?DOCKER_DATABASE_URL must be set with URL-encoded credentials}
      REDIS_URL: redis://redis:6379/0
      INBOX_ROOT: /var/lib/iddrv/inbox
      ARCHIVE_ROOT: /var/lib/iddrv/archive
      QUARANTINE_ROOT: /var/lib/iddrv/quarantine
      RAW_STORE_PATH: /var/lib/iddrv/raw
      INGEST_WATCH_ROOT: /var/lib/iddrv
      WATCH_INTERVAL_S: ${WATCH_INTERVAL_S:-5}
      # Liveness file written each poll by ingest.watcher (see heartbeat_is_fresh).
      WORKER_HEARTBEAT_PATH: /var/lib/iddrv/processing/.worker_heartbeat
      WORKER_HEARTBEAT_MAX_AGE_S: ${WORKER_HEARTBEAT_MAX_AGE_S:-90}
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "-m", "ingest.watcher", "--root", "/var/lib/iddrv", "--poll-seconds", "${WATCH_INTERVAL_S:-5}", "--stable-seconds", "${STABLE_SECONDS:-10}"]
    volumes:
      - ./data/inbox:/var/lib/iddrv/inbox
      - ./data/processing:/var/lib/iddrv/processing
      - ./data/archive:/var/lib/iddrv/archive
      - ./data/quarantine:/var/lib/iddrv/quarantine
      - ./data/raw:/var/lib/iddrv/raw
    healthcheck:
      # Fresh heartbeat proves the poll loop is alive (not merely that PID 1 exists).
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, sys; from pathlib import Path; from ingest.watcher import heartbeat_is_fresh; path = Path(os.environ.get('WORKER_HEARTBEAT_PATH', '/var/lib/iddrv/processing/.worker_heartbeat')); max_age = float(os.environ.get('WORKER_HEARTBEAT_MAX_AGE_S', '90')); sys.exit(0 if heartbeat_is_fresh(path, max_age_seconds=max_age) else 1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_ENABLE_3D: ${VITE_ENABLE_3D:-false}
        VITE_SKIP_AUTH: ${VITE_SKIP_AUTH:-false}
    restart: unless-stopped
    # Safe default: local HTTP only. Publish through an HTTPS reverse proxy for LAN access.
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

  # ─────────────────────────────────────────────────────
  # Redis Commander — Interface Web de monitoring Redis
  # (Optionnel — désactiver en prod)
  # ─────────────────────────────────────────────────────
  redis-commander:
    image: ghcr.io/joeferner/redis-commander:latest
    container_name: iddrv_redis_commander
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy
    profiles:
      - dev

volumes:
  timescaledb_data:
    driver: local
  redis_data:
    driver: local

networks:
  default:
    name: iddrv_network
