name: Model candidate validation and packaging
on:
  workflow_dispatch:
jobs:
  local-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install bounded ML test environment
        run: python -m pip install -r backend/requirements.txt pytest==8.4.2
      - name: Data, preparation, training, artifact and reproducibility tests
        run: python -m pytest -q tests/test_process_drift.py tests/test_model_artifact_compatibility.py tests/test_training_scripts.py tests/test_model_delivery.py
      - name: Train, evaluate, validate, package candidate (no deployment)
        run: python scripts/package_process_drift.py --data-dir data/scenarios/industrial_demo --output candidate
      - uses: actions/upload-artifact@v4
        with:
          name: process-drift-candidate-${{ github.sha }}
          path: candidate/
          retention-days: 7
          if-no-files-found: error
