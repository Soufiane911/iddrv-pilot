name: IDDRV Delivery

on:
  workflow_run:
    workflows: [IDDRV CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────
  # Livraison — BLOQUÉE en attente d'environnement cible
  # ─────────────────────────────────────────────────────
  #
  # Conditions de déblocage :
  #   1. Remote GitHub configuré (le dépôt n'a actuellement aucun remote)
  #   2. Secrets requis dans l'environnement GitHub :
  #      - DOCKER_REGISTRY         (ex: ghcr.io/<org>)
  #      - DOCKER_REGISTRY_USER    (ex: <org>)
  #      - DOCKER_REGISTRY_TOKEN   (GitHub PAT avec write:packages)
  #   3. Serveur cible accessible pour le déploiement
  #      - DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY
  #   4. Validation de sécurité approuvée
  #
  # En attendant la livraison vers un registre distant,
  # le déploiement on-premise est manuel et documenté
  # dans docs/on-prem-runbook.md.
  #
  # ─────────────────────────────────────────────────────

  delivery-blocked:
    name: Delivery (BLOCKED — no remote/registry)
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Delivery status
        run: |
          echo "::notice::La livraison automatisée est bloquée."
          echo ""
          echo "Prérequis manquants :"
          echo "  - Remote GitHub (git remote -v → vide)"
          echo "  - Secrets DOCKER_REGISTRY, DOCKER_REGISTRY_TOKEN"
          echo "  - Environnement cible (DEPLOY_HOST, etc.)"
          echo ""
          echo "Procédure manuelle actuelle :"
          echo "  docker compose up -d --build"
          echo "  docs/on-prem-runbook.md"
          exit 0

