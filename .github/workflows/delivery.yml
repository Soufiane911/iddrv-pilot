name: Delivery

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  # A workflow_run checks out the commit that CI actually validated, not the
  # default branch head at the time this workflow is scheduled.
  IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}

jobs:
  build-and-push:
    name: Build & push immutable Docker images
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Lowercase repository owner
        run: echo "REPO_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/${{ env.REPO_OWNER }}/iddrv-api:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ env.REPO_OWNER }}/iddrv-web:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy immutable SHA to pilot
    needs: build-and-push
    runs-on: ubuntu-24.04
    environment: pilot
    # DEPLOY_ENABLED is an explicit promotion switch. Without it this job is
    # skipped and deployment-status reports "not deployed" below.
    if: github.event.workflow_run.conclusion == 'success' && vars.DEPLOY_ENABLED == 'true'
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/iddrv' }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Lowercase repository owner for the pilot manifest
        run: echo "GHCR_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Validate pilot SSH prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" || { echo 'DEPLOY_HOST is required' >&2; exit 1; }
          test -n "$DEPLOY_USER" || { echo 'DEPLOY_USER is required' >&2; exit 1; }
          test -n "$DEPLOY_SSH_KEY" || { echo 'DEPLOY_SSH_KEY is required' >&2; exit 1; }
          test -n "$DEPLOY_KNOWN_HOSTS" || { echo 'DEPLOY_KNOWN_HOSTS is required' >&2; exit 1; }
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]] || { echo 'DEPLOY_PATH contains unsupported characters' >&2; exit 1; }
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]] || { echo 'workflow_run head SHA is invalid' >&2; exit 1; }

      - name: Copy deployment manifest and execute verified SSH deployment
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d "$RUNNER_TEMP/iddrv-ssh"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/iddrv-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/iddrv-ssh/known_hosts"
          printf '%s' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/iddrv-ssh/id_ed25519"
          chmod 600 "$RUNNER_TEMP/iddrv-ssh/id_ed25519"
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/iddrv-ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/iddrv-ssh/known_hosts"
          ssh -i "$RUNNER_TEMP/iddrv-ssh/id_ed25519" -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/iddrv-ssh/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" "install -d -m 750 '$DEPLOY_PATH'"
          scp -r -i "$RUNNER_TEMP/iddrv-ssh/id_ed25519" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/iddrv-ssh/known_hosts" \
            deploy/compose.pilot.yml deploy/deploy-pilot.sh db \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
          ssh -i "$RUNNER_TEMP/iddrv-ssh/id_ed25519" -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/iddrv-ssh/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "chmod 700 '$DEPLOY_PATH/deploy-pilot.sh' && IMAGE_TAG='$IMAGE_TAG' GHCR_OWNER='$GHCR_OWNER' DEPLOY_PATH='$DEPLOY_PATH' '$DEPLOY_PATH/deploy-pilot.sh'"

  deployment-status:
    name: Report deployment status
    needs: [build-and-push, deploy]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: State whether pilot was deployed
        shell: bash
        env:
          CI_RESULT: ${{ github.event.workflow_run.conclusion }}
          BUILD_RESULT: ${{ needs.build-and-push.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          PROMOTION_ENABLED: ${{ vars.DEPLOY_ENABLED }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          report() {
            printf '%s\n' "$1"
            printf '%s\n' "$1" >> "$GITHUB_STEP_SUMMARY"
          }
          report "CI: $CI_RESULT; build/push: $BUILD_RESULT; deploy: $DEPLOY_RESULT."
          # Actual delivery failures/cancellations must never become a no-op success.
          if [[ "$BUILD_RESULT" == "failure" || "$BUILD_RESULT" == "cancelled" ||
                "$DEPLOY_RESULT" == "failure" || "$DEPLOY_RESULT" == "cancelled" ]]; then
            report "Delivery failed or was cancelled; no successful deployment is claimed. Images may have been partially published."
            exit 1
          elif [[ "$CI_RESULT" != "success" && "$BUILD_RESULT" == "skipped" && "$DEPLOY_RESULT" == "skipped" ]]; then
            report "No delivery attempted: upstream CI did not succeed. No images published by this run; pilot not deployed."
          elif [[ "$CI_RESULT" == "success" && "$BUILD_RESULT" == "success" && "$DEPLOY_RESULT" == "success" ]]; then
            report "Images published. Pilot deployment job succeeded at immutable SHA $VALIDATED_SHA."
          elif [[ "$CI_RESULT" == "success" && "$BUILD_RESULT" == "success" && "$DEPLOY_RESULT" == "skipped" && "$PROMOTION_ENABLED" != "true" ]]; then
            report "Images published; pilot not deployed: DEPLOY_ENABLED is not true (no promotion)."
          else
            report "Unexpected delivery state; no successful deployment is claimed."
            exit 1
          fi
