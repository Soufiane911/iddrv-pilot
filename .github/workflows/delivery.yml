name: Delivery

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & push Docker images
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # GHCR exige des noms de dépôt en minuscules (le pseudo GitHub peut contenir des majuscules)
      - name: Lowercase repository owner
        run: echo "REPO_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_OWNER }}/iddrv-api:${{ github.sha }}
            ghcr.io/${{ env.REPO_OWNER }}/iddrv-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_OWNER }}/iddrv-web:${{ github.sha }}
            ghcr.io/${{ env.REPO_OWNER }}/iddrv-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to pilot
    needs: build-and-push
    runs-on: ubuntu-24.04
    environment: pilot
    if: github.event.workflow_run.conclusion == 'success' && vars.DEPLOY_HOST != ''
    steps:
      - name: Deploy on-premise
        run: |
          echo "Déploiement on-premise conditionné par les variables DEPLOY_HOST / DEPLOY_USER"
          echo "et le secret DEPLOY_SSH_KEY."
          echo ""
          echo "Commande type :"
          echo "  ssh ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }} \"cd /opt/iddrv && docker compose pull && docker compose up -d\""
