name: CI

on:
  push:
    branches: [main, develop, 'codex/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run unit tests (E2E excluded — needs Docker)
        run: python -m pytest -q --ignore=tests/e2e

  e2e:
    name: E2E (TimescaleDB + Redis)
    runs-on: ubuntu-latest
    services:
      timescaledb:
        image: timescale/timescaledb:2.28.2-pg16
        env:
          POSTGRES_DB: iddrv
          POSTGRES_USER: iddrv_user
          POSTGRES_PASSWORD: iddrv_ci_password
          TIMESCALEDB_TELEMETRY: "off"
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U iddrv_user -d iddrv"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      E2E_DATABASE_URL: postgresql://iddrv_user:iddrv_ci_password@localhost:5432/iddrv
      E2E_REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run E2E harness
        run: python tests/e2e/run_tests.py -t 1,2

  frontend:
    name: Frontend (lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm run test
      - name: Build
        run: npm run build

  compose:
    name: Compose configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: docker compose config --quiet
